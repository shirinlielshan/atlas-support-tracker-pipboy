<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support Calendar</title>
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="pip-boy-container">
    <div class="screen">
      <div id="calendar"></div>
      <a href="index.html" class="pip-boy-button back-button">Exit Calendar</a>
    </div>
  </div>
  <div id="event-modal" class="terminal-modal">
    <div class="modal-content">
      <p id="event-details"></p>
      <button onclick="closeModal()" class="pip-boy-button">EXIT</button>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/typed.js@2.0.12/lib/typed.min.js"></script>
  <script src="js/supportSchedule.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
